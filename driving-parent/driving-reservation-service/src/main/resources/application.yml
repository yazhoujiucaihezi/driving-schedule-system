server:
  port: 18087

spring:
  application:
    name: driving-reservation-service
  rabbitmq:
    host: 192.168.181.128
    port: 5672
    username: box
    password: 123
  data:
    redis:
      host: 192.168.181.128
      port: 6379

  # AI 对话功能所用的大模型：智谱 GLM（OpenAI 兼容接口）
  # key 优先读环境变量 ZHIPU_API_KEY，没设时用占位值（仅够启动，调不通模型）
  ai:
    openai:
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4-flash
          temperature: 0.7

  datasource:
    url: jdbc:mysql://192.168.181.128:3306/driving_school_schedule?...
    username: root
    password: 123

  cloud:
    nacos:
      discovery:
        server-addr: 192.168.181.128:8848
    sentinel:
      transport:
        dashboard: 192.168.181.128:8080
        port: 8719
        client-ip: 192.168.181.1
      eager: true
      datasource:
        flow:
          nacos:
            server-addr: 192.168.181.128:8848
            data-id: driving-reservation-service-flow-rules
            group-id: SENTINEL_GROUP
            data-type: json
            rule-type: flow
    openfeign:
      client:
        config:
          default:
            connectTimeout: 2000
            readTimeout: 5000
feign:
  sentinel:
    enabled: true

# 服务间内部调用凭证：凡是要访问 /internal/** 的请求必须带这个头，各服务保持一致
internal:
  token: "DrivingInternalCall2026"

# 本服务扫描 com.box，会把 common 里的 JwtUtils 一起装配，所以必须有密钥配置
jwt:
  secret: "DrivingSchoolSecretKey2026ForJWTTokenSigning!!"
  expiration: 86400000