server:
  port: 8000

spring:
  application:
    name: driving-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.181.128:8848
    gateway:
      routes:
        - id: user-service
          uri: lb://driving-user-service     # lb = load balance
          predicates:
            - Path=/api/users/**
        - id: auth-service
          uri: lb://driving-auth-service
          predicates:
            - Path=/api/auth/**
        - id: coach-service
          uri: lb://driving-coach-service
          predicates:
            - Path=/api/coaches/**
        - id: student-service
          uri: lb://driving-student-service
          predicates:
            - Path=/api/students/**