server:
  port: 8000

spring:
  application:
    name: driving-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.181.128:8848
    gateway:
      routes:
        - id: user-service
          uri: lb://driving-user-service     # lb = load balance
          predicates:
            - Path=/api/users/**
        - id: auth-service
          uri: lb://driving-auth-service
          predicates:
            - Path=/api/auth/**
        - id: coach-service
          uri: lb://driving-coach-service
          predicates:
            - Path=/api/coaches/**
        - id: student-service
          uri: lb://driving-student-service
          predicates:
            - Path=/api/students/**
        - id: vehicle-service
          uri: lb://driving-vehicle-service
          predicates:
            - Path=/api/vehicles/**
        - id: schedule-service
          uri: lb://driving-schedule-service
          predicates:
            - Path=/api/schedules/**
        - id: training-record-service
          uri: lb://driving-training-service
          predicates:
            - Path=/api/training-records/**
        - id: reservation-service
          uri: lb://driving-reservation-service
          predicates:
            - Path=/api/reservations/**